<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>agentx</title>
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="app">
    <aside class="side" id="side">
      <div class="brand">
        <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M6 8 16 16 6 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="21" y="8" width="3" height="16" rx=".5" fill="currentColor"/></svg>
        <span class="brand-name">agentx</span>
        <button type="button" class="icon-btn side-close" id="sideClose" aria-label="Hide the sidebar" title="Hide the sidebar (Ctrl+B)">
          <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="2.5" width="12" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M6 2.5v11" stroke="currentColor" stroke-width="1.3"/></svg>
        </button>
      </div>
      <button class="side-row new-chat" id="newChat" type="button">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3.5v9M3.5 8h9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        New conversation
      </button>
      <h2 class="side-title">Recent</h2>
      <nav class="sessions" id="sessions" aria-label="Conversations"></nav>
      <div class="side-foot">
        <button type="button" class="side-row folder" id="folder" aria-haspopup="menu" aria-expanded="false" title="">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4.5A1.5 1.5 0 0 1 3.5 3h2.6l1.4 1.5h5A1.5 1.5 0 0 1 14 6v5.5a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 2 11.5z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
          <span class="row-text"><span class="row-label" id="folderName"></span><span class="row-hint">Folder · switch</span></span>
          <svg class="row-chev" viewBox="0 0 12 12" aria-hidden="true"><path d="M4 3 7 6 4 9" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button type="button" class="side-row" id="settingsBtn">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6.8 1.8h2.4l.4 1.7 1.2.7 1.7-.5 1.2 2-1.3 1.2v1.4l1.3 1.2-1.2 2-1.7-.5-1.2.7-.4 1.7H6.8l-.4-1.7-1.2-.7-1.7.5-1.2-2 1.3-1.2V7.3L2.3 6.1l1.2-2 1.7.5 1.2-.7z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/><circle cx="8" cy="8" r="2" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
          <span class="row-text"><span class="row-label">Settings</span></span>
        </button>
      </div>
    </aside>

    <main class="main">
      <header class="top">
        <button type="button" class="icon-btn side-toggle" id="sideToggle" aria-label="Show the sidebar" title="Show the sidebar (Ctrl+B)">
          <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="2.5" width="12" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M6 2.5v11" stroke="currentColor" stroke-width="1.3"/></svg>
        </button>
        <div class="top-title" id="topTitle">New conversation</div>
        <button type="button" class="top-btn" id="detailsBtn" aria-expanded="false" aria-controls="details">
          <span class="ctx-ring" id="ctxRing" aria-hidden="true"></span>
          <span id="detailsLabel">Details</span>
        </button>
      </header>

      <section class="log" id="log" aria-live="polite">
        <div class="column" id="column"></div>
      </section>

      <footer class="dock">
        <button type="button" class="jump" id="jump" aria-label="Jump to the latest" title="Jump to the latest" hidden>
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3.8 8.8 8 13l4.2-4.2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="column">
          <div class="team" id="team" hidden></div>
          <ul class="waiting" id="waiting" hidden></ul>
          <div class="status" id="status" hidden>
            <span class="spinner" aria-hidden="true"></span>
            <span class="status-label" id="statusLabel"></span>
            <span class="status-time" id="statusTime"></span>
            <span class="status-key">Esc to stop</span>
          </div>
          <form class="composer" id="composer" autocomplete="off">
            <div class="palette" id="palette" role="listbox" hidden></div>
            <div class="menu" id="menu" role="listbox" hidden></div>
            <textarea id="input" rows="2" placeholder="Ask agentx to do something in this folder" aria-label="Message"></textarea>
            <div class="composer-bar">
              <button type="button" class="icon-btn" id="attachBtn" aria-label="Add a picture" title="Add a picture (or paste one)">
                <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
              </button>
              <input type="file" id="fileInput" accept="image/png,image/jpeg,image/gif,image/webp" multiple hidden>
              <button type="button" class="pill" id="modeBtn" aria-haspopup="listbox" aria-expanded="false">
                <span class="visually-hidden">Mode: </span><span class="pill-label" id="modeLabel">Ask before changes</span>
                <svg class="pill-chev" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 4.5 6 7.5 9 4.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
              <span class="bar-gap"></span>
              <button type="button" class="pill" id="modelBtn" aria-haspopup="listbox" aria-expanded="false">
                <span class="visually-hidden">Model: </span><span class="pill-label" id="modelLabel">Model</span>
                <svg class="pill-chev" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 4.5 6 7.5 9 4.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
              <button type="button" class="icon-btn" id="micBtn" aria-label="Speak instead of typing" title="Speak instead of typing">
                <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="5.75" y="1.75" width="4.5" height="8" rx="2.25" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M3.5 7.5a4.5 4.5 0 0 0 9 0M8 12v2.2" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
              </button>
              <button type="submit" class="send" id="sendBtn" aria-label="Send">
                <svg class="i-send" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 13V3.5M3.8 7.5 8 3.3l4.2 4.2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
                <svg class="i-stop" viewBox="0 0 16 16" aria-hidden="true"><rect x="4" y="4" width="8" height="8" rx="1.5" fill="currentColor"/></svg>
              </button>
            </div>
          </form>
        </div>
      </footer>
    </main>

    <aside class="details" id="details" aria-label="Details" hidden>
      <div class="details-head">
        <h2>Details</h2>
        <button type="button" class="icon-btn" id="detailsClose" aria-label="Close details">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="details-body" id="detailsBody"></div>
    </aside>
  </div>

  <div class="sheet-wrap" id="settingsWrap" hidden>
    <section class="sheet" id="settings" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <div class="sheet-head">
        <h2 id="settingsTitle">Settings</h2>
        <button type="button" class="icon-btn" id="settingsClose" aria-label="Close settings">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="scope" role="tablist" aria-label="Where the settings apply">
        <button type="button" role="tab" id="scopeUser" data-scope="user" aria-selected="true">All folders</button>
        <button type="button" role="tab" id="scopeFolder" data-scope="folder" aria-selected="false">This folder</button>
      </div>
      <form class="sheet-body" id="settingsForm" autocomplete="off"></form>
      <div class="sheet-foot">
        <span class="sheet-msg" id="settingsMsg" role="status"></span>
        <button type="button" class="btn" id="settingsCancel">Close</button>
        <button type="button" class="btn primary" id="settingsSave">Save</button>
      </div>
    </section>
  </div>
  <div class="overlay" id="overlay" hidden><div class="overlay-box" id="overlayBox" role="dialog" aria-modal="true"></div></div>
  <script src="/app.js"></script>
</body>
</html>
