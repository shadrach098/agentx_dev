<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>agentx</title>
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="app">
    <aside class="side" id="side">
      <div class="brand">
        <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M6 8 16 16 6 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="21" y="8" width="3" height="16" rx=".5" fill="currentColor"/></svg>
        <span class="brand-name">agentx</span>
        <button type="button" class="icon-btn side-close" id="sideClose" aria-label="Hide the sidebar" title="Hide the sidebar (Ctrl+B)">
          <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="2.5" width="12" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M6 2.5v11" stroke="currentColor" stroke-width="1.3"/></svg>
        </button>
      </div>
      <button class="side-row new-chat" id="newChat" type="button">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3.5v9M3.5 8h9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        New conversation
      </button>
      <h2 class="side-title">Recent</h2>
      <nav class="sessions" id="sessions" aria-label="Conversations"></nav>
      <div class="side-foot">
        <div class="folder" id="folder" title="">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4.5A1.5 1.5 0 0 1 3.5 3h2.6l1.4 1.5h5A1.5 1.5 0 0 1 14 6v5.5a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 2 11.5z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
          <span id="folderName"></span>
        </div>
        <div class="foot-buttons">
          <button type="button" class="icon-btn" id="usageBtn" aria-label="Usage" title="Usage">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 13V8M8 13V3M13 13V6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </button>
          <button type="button" class="icon-btn" id="settingsBtn" aria-label="Settings" title="Settings">
            <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="2.2" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M8 1.8v1.6M8 12.6v1.6M1.8 8h1.6M12.6 8h1.6M3.6 3.6l1.1 1.1M11.3 11.3l1.1 1.1M3.6 12.4l1.1-1.1M11.3 4.7l1.1-1.1" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
          </button>
          <button type="button" class="icon-btn" id="themeBtn" aria-label="Switch light or dark" title="Light or dark">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 9.6A5.6 5.6 0 0 1 6.4 2.5a5.6 5.6 0 1 0 7.1 7.1z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="top">
        <button type="button" class="icon-btn side-toggle" id="sideToggle" aria-label="Show the sidebar" title="Show the sidebar (Ctrl+B)">
          <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="2.5" width="12" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M6 2.5v11" stroke="currentColor" stroke-width="1.3"/></svg>
        </button>
        <div class="top-title" id="topTitle">New conversation</div>
      </header>

      <section class="log" id="log" aria-live="polite">
        <div class="column" id="column"></div>
      </section>

      <footer class="dock">
        <button type="button" class="jump" id="jump" aria-label="Jump to the latest" title="Jump to the latest" hidden>
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3.8 8.8 8 13l4.2-4.2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="column">
          <div class="team" id="team" hidden></div>
          <ul class="waiting" id="waiting" hidden></ul>
          <div class="status" id="status" hidden>
            <span class="spinner" aria-hidden="true"></span>
            <span class="status-label" id="statusLabel"></span>
            <span class="status-time" id="statusTime"></span>
            <span class="status-key">Esc to stop</span>
          </div>
          <form class="composer" id="composer" autocomplete="off">
            <div class="palette" id="palette" role="listbox" hidden></div>
            <textarea id="input" rows="2" placeholder="Ask agentx to do something in this folder" aria-label="Message"></textarea>
            <div class="composer-bar">
              <button type="button" class="icon-btn" id="attachBtn" aria-label="Add a picture" title="Add a picture (or paste one)">
                <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
              </button>
              <input type="file" id="fileInput" accept="image/png,image/jpeg,image/gif,image/webp" multiple hidden>
              <label class="pill">
                <span class="visually-hidden">Mode</span>
                <select id="mode" aria-label="Mode">
                  <option value="default">Ask before changes</option>
                  <option value="accept-edits">Accept edits</option>
                  <option value="plan">Plan only</option>
                  <option value="auto">Auto</option>
                </select>
              </label>
              <span class="bar-gap"></span>
              <label class="pill">
                <span class="visually-hidden">Model</span>
                <select id="model" aria-label="Model"></select>
              </label>
              <button type="button" class="icon-btn" id="micBtn" aria-label="Speak instead of typing" title="Speak instead of typing">
                <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="5.75" y="1.75" width="4.5" height="8" rx="2.25" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M3.5 7.5a4.5 4.5 0 0 0 9 0M8 12v2.2" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
              </button>
              <button type="submit" class="send" id="sendBtn" aria-label="Send">
                <svg class="i-send" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 13V3.5M3.8 7.5 8 3.3l4.2 4.2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
                <svg class="i-stop" viewBox="0 0 16 16" aria-hidden="true"><rect x="4" y="4" width="8" height="8" rx="1.5" fill="currentColor"/></svg>
              </button>
            </div>
          </form>
        </div>
      </footer>
    </main>
  </div>
  <div class="overlay" id="overlay" hidden><div class="overlay-box" id="overlayBox"></div></div>
  <script src="/app.js"></script>
</body>
</html>
