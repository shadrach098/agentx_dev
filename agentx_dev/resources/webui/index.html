<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>agentx</title>
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="app">
    <aside class="side" id="side">
      <div class="brand">
        <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M6 8 16 16 6 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="21" y="8" width="3" height="16" rx=".5" fill="currentColor"/></svg>
        <span class="brand-name">agentx</span>
      </div>
      <div class="folder" id="folder" title=""></div>
      <button class="new-chat" id="newChat" type="button">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        New conversation
      </button>
      <h2 class="side-title">Conversations in this folder</h2>
      <nav class="sessions" id="sessions" aria-label="Conversations"></nav>
      <div class="side-foot">
        <button type="button" class="ghost" id="usageBtn">Usage</button>
        <button type="button" class="ghost" id="settingsBtn">Settings</button>
        <button type="button" class="ghost icon-only" id="themeBtn" aria-label="Switch light or dark">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2a6 6 0 1 0 0 12A6 6 0 0 1 8 2z" fill="currentColor"/></svg>
        </button>
      </div>
    </aside>

    <main class="main">
      <header class="top">
        <button type="button" class="ghost icon-only side-toggle" id="sideToggle" aria-label="Show conversations">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4h12M2 8h12M2 12h12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
        <div class="top-title" id="topTitle">New conversation</div>
        <label class="picker">
          <span class="visually-hidden">Model</span>
          <select id="model" aria-label="Model"></select>
        </label>
        <label class="picker">
          <span class="visually-hidden">Mode</span>
          <select id="mode" aria-label="Mode">
            <option value="default">Ask before changes</option>
            <option value="accept-edits">Accept edits</option>
            <option value="plan">Plan only</option>
            <option value="auto">Auto</option>
          </select>
        </label>
      </header>

      <section class="log" id="log" aria-live="polite">
        <div class="column" id="column"></div>
      </section>

      <footer class="dock">
        <div class="column">
          <div class="team" id="team" hidden></div>
          <ul class="waiting" id="waiting" hidden></ul>
          <div class="status" id="status" hidden>
            <span class="pulse" aria-hidden="true"></span>
            <span class="status-label" id="statusLabel"></span>
            <span class="status-time" id="statusTime"></span>
            <button type="button" class="stop" id="stopBtn">Stop</button>
          </div>
          <form class="composer" id="composer" autocomplete="off">
            <div class="palette" id="palette" role="listbox" hidden></div>
            <textarea id="input" rows="1" placeholder="Ask agentx to do something in this folder" aria-label="Message"></textarea>
            <div class="composer-bar">
              <span class="hint" id="hint">Enter sends · Shift+Enter adds a line · / for commands · paste a screenshot to add it</span>
              <button type="button" class="ghost icon-only" id="micBtn" aria-label="Speak instead of typing">
                <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="5.5" y="1.5" width="5" height="9" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M3 7.5a5 5 0 0 0 10 0M8 12.5V15" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
              </button>
              <button type="submit" class="send" id="sendBtn" aria-label="Send">
                <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 13V3M3.5 7.5 8 3l4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
            </div>
          </form>
        </div>
      </footer>
    </main>
  </div>
  <div class="overlay" id="overlay" hidden><div class="overlay-box" id="overlayBox"></div></div>
  <script src="/app.js"></script>
</body>
</html>
