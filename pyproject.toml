[project]

name = "agentx-dev"
version = "3.7.0"
description = "Build LLM agents in Python, and get agentx: a coding assistant for your terminal. GPT and Claude, permission-gated tools, skills, MCP, team jobs with helpers that run in parallel, RAG, memory and evals."
keywords = ["llm", "agents", "ai-agents", "multi-agent", "coding-assistant", "terminal", "cli",
            "openai", "anthropic", "claude", "gpt", "mcp", "rag", "tool-calling", "supervisor", "skills"]
authors = [{ name = "Bruce-Arhin Shadrach", email = "brucearhin098@gmail.com" }]
# An SPDX expression plus the file (the table form is deprecated and will stop building)
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
# Codebase uses PEP 604 union types (str | None) which require 3.10+.
requires-python = ">=3.10"

# Core runtime: what every install pulls, kept small. The vector-store clients
# (chromadb alone is hundreds of megabytes) and pandas are extras again: [rag]
# for ChromaVectorStore / QdrantVectorStore / PgVectorStore, [excel] for
# spreadsheets in Media, [all] for everything. Each class that needs one says
# which extra to install when it is missing.
dependencies = [
    "openai>=1.0.0",       # ChatModel.GPT + native tool-calling API
    "pydantic>=2.0",       # StructuredTool schemas, output parsing, everywhere
    "PyYAML>=5.3.1",       # AgentType prompt templates (>=5.3.1 for CVE fixes)
    "rich>=10.0",          # console output in the Agents module
    "prompt_toolkit>=3.0",   # the agentx command's input line
]

[project.optional-dependencies]
# `pip install agentx-dev[anthropic]` — enables agentx_dev.Claude
anthropic = ["anthropic>=0.36"]     # 3.1 needs Batch API + prompt cache
# `pip install agentx-dev[mcp]` — enables MCPClient (stdio / sse / http) and /mcp in agentx; keyring keeps
# an MCP server's sign-in in the system's credential store
mcp = ["mcp>=1.10,<2", "keyring>=24"]      # 2.x changed the client API; not supported yet
# `pip install agentx-dev[otel]` — enables the OTelHook observability adapter
otel = ["opentelemetry-api>=1.20", "opentelemetry-sdk>=1.20"]
# `pip install agentx-dev[rag]` — all three vector-store adapters
rag = ["chromadb>=0.4", "qdrant-client>=1.6", "psycopg[binary]>=3.1"]
# `pip install agentx-dev[chroma]` — ChromaVectorStore adapter only
chroma = ["chromadb>=0.4"]
# `pip install agentx-dev[qdrant]` — QdrantVectorStore adapter
qdrant = ["qdrant-client>=1.6"]
# `pip install agentx-dev[pgvector]` — PgVectorStore adapter (psycopg v3)
pgvector = ["psycopg[binary]>=3.1"]
# `pip install agentx-dev[excel]` — spreadsheets (.xlsx, .ods) in Media
excel = ["pandas>=1.5", "openpyxl>=3.1"]
# `pip install agentx-dev[voice]` — /voice in agentx reads the microphone (the words are written out by OpenAI)
voice = ["sounddevice>=0.4", "numpy>=1.24"]
# `pip install agentx-dev[dev]` — everything needed to run the tests
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "httpx>=0.24",         # tests build httpx.Response objects; newer openai/anthropic no longer pull httpx in
    "numpy>=1.24",
    "pandas>=1.5",
    "openpyxl>=3.1",
]
# `pip install agentx-dev[all]` — the works
all = [
    "anthropic>=0.36",
    "mcp>=1.10,<2",
    "keyring>=24",
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "chromadb>=0.4",
    "qdrant-client>=1.6",
    "psycopg[binary]>=3.1",
    "pandas>=1.5",
    "openpyxl>=3.1",
    "sounddevice>=0.4",
    "numpy>=1.24",
]

[tool.pytest.ini_options]
# The benchmark's sample repos (bench/repos) have their own tests, one failing on purpose.
testpaths = ["tests"]

[project.scripts]
agentx = "agentx_dev.cli:main"

[project.urls]
Homepage = "https://github.com/shadrach098/agentx_dev"
"Bug Tracker" = "https://github.com/shadrach098/agentx_dev/issues"
Source = "https://github.com/shadrach098/agentx_dev"

[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"
# In pyproject.toml

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
# Only the framework: examples/ and host/ (the docs site) stay in the source download, not in site-packages.
include = ["agentx_dev*"]



